[package]
name = "cc_cli"
description = "ConstructCraft command line and MCP server (no GUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "ccad"
path = "src/main.rs"

[dependencies]
cc_core.workspace = true
cc_engine.workspace = true
cc_plugins.workspace = true
serde_json.workspace = true

[features]
# Revit import: `rvt_import` and its menu entries (see cc_engine's `rvt` feature).
rvt = ["cc_engine/rvt"]

[lints]
workspace = true
