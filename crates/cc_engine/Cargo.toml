[package]
autotests = false
name = "cc_engine"
description = "ConstructCraft engine: every user-facing operation as a named command, without a GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cc_core.workspace = true
cc_geom.workspace = true
cc_script.workspace = true
mlua.workspace = true
cc_views.workspace = true
cc_raytracing.workspace = true
cc_ifc.workspace = true
cc_cad.workspace = true
cc_skp.workspace = true
cc_rvt = { workspace = true, optional = true }
glam.workspace = true
png.workspace = true
draco-core.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sys-locale.workspace = true

[features]
# Revit import (`rvt_import`), off by default: the .rvt reader is a
# reverse-engineered third-party crate (docs/architecture/interop.md, cc_rvt).
rvt = ["dep:cc_rvt"]

[lints]
workspace = true

[dev-dependencies]
image.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
