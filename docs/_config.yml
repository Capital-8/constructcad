# GitHub Pages (Jekyll) settings for the site built from /docs.
# index.html is a plain page; the Markdown guides render with the theme below.
title: ConstructCAD
description: Free and open source BIM software, written in Rust.
theme: jekyll-theme-primer
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
