name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  ifc:
    name: IFC validation (IfcOpenShell)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install IfcOpenShell (CI only, not a project dependency)
        run: pip install -r scripts/requirements-ifc.txt
      - name: Export sample projects
        run: |
          mkdir -p target/ifc
          cargo run --locked -p cc_ifc --example export_ifc -- examples/casa_simples.ccad target/ifc/casa_simples.ifc
          cargo run --locked -p cc_ifc --example export_ifc -- crates/cc_ifc/tests/fixtures/features.ccad target/ifc/features.ifc
          cargo run --locked -p cc_ifc --example export_ifc -- crates/cc_ifc/tests/fixtures/classes.ifc target/ifc/classes.ifc
      - name: Validate
        run: |
          python scripts/validate_ifc.py target/ifc/casa_simples.ifc
          python scripts/validate_ifc.py target/ifc/features.ifc
          python scripts/validate_ifc.py target/ifc/classes.ifc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ifc-exports
          path: target/ifc/*.ifc

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check Signed-off-by lines
        run: |
          status=0
          for sha in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format=%B "$sha" | grep -qF "Signed-off-by: $author"; then
              echo "::error::Commit $sha is missing 'Signed-off-by: $author'"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Sign off your commits with 'git commit -s' (see CONTRIBUTING.md)."
          fi
          exit $status
